<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><style>text{font-family:'PingFang SC','Heiti SC',sans-serif}</style><rect x="0" y="0" width="1600" height="1040" rx="0" fill="#F5F8FB" stroke="none"/><text x="64" y="65" fill="#3262D9" font-size="21" font-weight="700">01 / REPORT AUTOMATION</text><text x="64" y="132" fill="#16283D" font-size="48" font-weight="700">把制作步骤连起来，把业务口径保留下来</text><text x="64" y="181" fill="#586D80" font-size="26" font-weight="400">共同逻辑可以复用，不同对象的分析内容放进配置和分级模板。</text><rect x="64" y="230" width="1472" height="86" rx="16" fill="#16283D" stroke="none"/><text x="92" y="284" fill="#fff" font-size="28" font-weight="700">业务约定</text><text x="300" y="284" fill="#DCE7F2" font-size="27" font-weight="400">指标与分母</text><text x="635" y="284" fill="#DCE7F2" font-size="27" font-weight="400">对象筛选与报告层级</text><text x="1090" y="284" fill="#DCE7F2" font-size="27" font-weight="400">章节范围与验收要求</text><rect x="64" y="370" width="338" height="287" rx="16" fill="#fff" stroke="#D8E2EA"/><text x="88" y="414" fill="#3262D9" font-size="23" font-weight="700">01</text><text x="88" y="463" fill="#16283D" font-size="31" font-weight="700">接入与适配</text><text x="88" y="521" fill="#586D80" font-size="26" font-weight="400">Excel 数据</text><text x="88" y="565" fill="#586D80" font-size="26" font-weight="400">字段映射</text><text x="88" y="609" fill="#586D80" font-size="26" font-weight="400">任务配置</text><path d="M408 512 L435 512" fill="none" stroke="#3262D9" stroke-width="3"/><path d="M426 505 L435 512 L426 519" fill="none" stroke="#3262D9" stroke-width="3"/><rect x="442" y="370" width="338" height="287" rx="16" fill="#fff" stroke="#D8E2EA"/><text x="466" y="414" fill="#3262D9" font-size="23" font-weight="700">02</text><text x="466" y="463" fill="#16283D" font-size="31" font-weight="700">统计与图表</text><text x="466" y="521" fill="#586D80" font-size="26" font-weight="400">确定性计算</text><text x="466" y="565" fill="#586D80" font-size="26" font-weight="400">统一指标口径</text><text x="466" y="609" fill="#586D80" font-size="26" font-weight="400">生成分析图表</text><path d="M786 512 L813 512" fill="none" stroke="#3262D9" stroke-width="3"/><path d="M804 505 L813 512 L804 519" fill="none" stroke="#3262D9" stroke-width="3"/><rect x="820" y="370" width="338" height="287" rx="16" fill="#fff" stroke="#D8E2EA"/><text x="844" y="414" fill="#3262D9" font-size="23" font-weight="700">03</text><text x="844" y="463" fill="#16283D" font-size="31" font-weight="700">文字与文档</text><text x="844" y="521" fill="#586D80" font-size="26" font-weight="400">基于统计上下文解读</text><text x="844" y="565" fill="#586D80" font-size="26" font-weight="400">按层级组织章节</text><text x="844" y="609" fill="#586D80" font-size="26" font-weight="400">Word / PDF 输出</text><path d="M1164 512 L1191 512" fill="none" stroke="#3262D9" stroke-width="3"/><path d="M1182 505 L1191 512 L1182 519" fill="none" stroke="#3262D9" stroke-width="3"/><rect x="1198" y="370" width="338" height="287" rx="16" fill="#fff" stroke="#D8E2EA"/><text x="1222" y="414" fill="#087F78" font-size="23" font-weight="700">04</text><text x="1222" y="463" fill="#16283D" font-size="31" font-weight="700">人工验收</text><text x="1222" y="521" fill="#586D80" font-size="26" font-weight="400">核对数字与完整性</text><text x="1222" y="565" fill="#586D80" font-size="26" font-weight="400">检查图文和引用</text><text x="1222" y="609" fill="#586D80" font-size="26" font-weight="400">逐页查看成品</text><rect x="64" y="711" width="1472" height="226" rx="18" fill="#FFF3DF" stroke="none"/><text x="94" y="758" fill="#AF6B15" font-size="29" font-weight="700">一次实际纠偏：文件生成了，分析却不完整</text><text x="94" y="810" fill="#16283D" font-size="27" font-weight="400">校级分析被压缩到 4 个逻辑图号 → 暂停生产，重新核对业务方案</text><text x="94" y="854" fill="#16283D" font-size="27" font-weight="400">确认 10 个图号 → 同步调整图表、逐图解读、章节模板与检查规则</text><text x="94" y="898" fill="#16283D" font-size="27" font-weight="400">最终成品：26 页报告，保留整体、群体与结果—过程分析</text><path d="M64 972 L1536 972" fill="none" stroke="#D8E2EA" stroke-width="2"/><text x="64" y="1010" fill="#586D80" font-size="20" font-weight="400">程序计算 · AI 辅助解读 · 人工确认交付</text><text x="1110" y="1010" fill="#586D80" font-size="20" font-weight="400">历史成品已脱敏，可直接查看 PDF</text></svg>