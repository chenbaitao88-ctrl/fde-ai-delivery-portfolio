<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><style>text{font-family:'PingFang SC','Heiti SC',sans-serif}</style><rect x="0" y="0" width="1600" height="830" rx="0" fill="#F5F8FB" stroke="none"/><text x="64" y="65" fill="#3262D9" font-size="21" font-weight="700">03 / TEAM ENABLEMENT</text><text x="64" y="132" fill="#16283D" font-size="48" font-weight="700">从“看懂了”，走到自己的任务里</text><text x="64" y="181" fill="#586D80" font-size="26" font-weight="400">选择熟悉的工作场景，讲清输入与交付，再跟进第一次实际使用。</text><rect x="64" y="254" width="338" height="300" rx="18" fill="#fff" stroke="#D8E2EA"/><text x="88" y="300" fill="#087F78" font-size="23" font-weight="700">01</text><text x="88" y="355" fill="#16283D" font-size="29" font-weight="700">选岗位任务</text><text x="88" y="414" fill="#586D80" font-size="24" font-weight="400">分散数据统计</text><text x="88" y="459" fill="#586D80" font-size="24" font-weight="400">周报 / 月报</text><text x="88" y="504" fill="#586D80" font-size="24" font-weight="400">贴近真实字段与格式</text><path d="M408 409 L435 409" fill="none" stroke="#087F78" stroke-width="3"/><path d="M426 402 L435 409 L426 416" fill="none" stroke="#087F78" stroke-width="3"/><rect x="442" y="254" width="338" height="300" rx="18" fill="#fff" stroke="#D8E2EA"/><text x="466" y="300" fill="#087F78" font-size="23" font-weight="700">02</text><text x="466" y="355" fill="#16283D" font-size="29" font-weight="700">讲清怎么做</text><text x="466" y="414" fill="#586D80" font-size="24" font-weight="400">输入是什么</text><text x="466" y="459" fill="#586D80" font-size="24" font-weight="400">任务目标是什么</text><text x="466" y="504" fill="#586D80" font-size="24" font-weight="400">最后交付成什么样</text><path d="M786 409 L813 409" fill="none" stroke="#087F78" stroke-width="3"/><path d="M804 402 L813 409 L804 416" fill="none" stroke="#087F78" stroke-width="3"/><rect x="820" y="254" width="338" height="300" rx="18" fill="#fff" stroke="#D8E2EA"/><text x="844" y="300" fill="#087F78" font-size="23" font-weight="700">03</text><text x="844" y="355" fill="#16283D" font-size="29" font-weight="700">根据反馈调整</text><text x="844" y="414" fill="#586D80" font-size="24" font-weight="400">工作模式选择</text><text x="844" y="459" fill="#586D80" font-size="24" font-weight="400">任务描述方法</text><text x="844" y="504" fill="#586D80" font-size="24" font-weight="400">非技术用户学习成本</text><path d="M1164 409 L1191 409" fill="none" stroke="#087F78" stroke-width="3"/><path d="M1182 402 L1191 409 L1182 416" fill="none" stroke="#087F78" stroke-width="3"/><rect x="1198" y="254" width="338" height="300" rx="18" fill="#fff" stroke="#D8E2EA"/><text x="1222" y="300" fill="#087F78" font-size="23" font-weight="700">04</text><text x="1222" y="355" fill="#16283D" font-size="29" font-weight="700">训后应用与支持</text><text x="1222" y="414" fill="#586D80" font-size="24" font-weight="400">复盘报告 · 辅助出题</text><text x="1222" y="459" fill="#586D80" font-size="24" font-weight="400">日常数据分析与工作流</text><text x="1222" y="504" fill="#586D80" font-size="24" font-weight="400">继续解答实际使用问题</text><rect x="64" y="601" width="1472" height="124" rx="18" fill="#E7F4F0" stroke="none"/><text x="92" y="646" fill="#087F78" font-size="31" font-weight="700">3 场培训 · 约 100 人参与</text><text x="92" y="694" fill="#16283D" font-size="25" font-weight="400">后续采用来自使用反馈与求助记录；未统计采用率或培训带来的独立提效比例。</text><path d="M64 762 L1536 762" fill="none" stroke="#D8E2EA" stroke-width="2"/><text x="64" y="800" fill="#586D80" font-size="20" font-weight="400">复用方式：岗位任务 → 输入与口径 → 操作步骤 → 人工检查</text><text x="1110" y="800" fill="#586D80" font-size="20" font-weight="400">附一张从经验整理的任务卡</text></svg>