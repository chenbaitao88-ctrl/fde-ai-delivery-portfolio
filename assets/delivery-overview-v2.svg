<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><style>text{font-family:'PingFang SC','Heiti SC',sans-serif}</style><rect x="0" y="0" width="1600" height="830" rx="0" fill="#F5F8FB" stroke="none"/><text x="64" y="65" fill="#3262D9" font-size="21" font-weight="700">AI APPLICATION DELIVERY</text><text x="64" y="132" fill="#16283D" font-size="48" font-weight="700">把 AI 用进日常交付</text><text x="64" y="181" fill="#586D80" font-size="26" font-weight="400">从工作中的重复环节出发，做到有成品、能复核、有人继续使用。</text><rect x="64" y="233" width="468" height="494" rx="22" fill="#fff" stroke="#D8E2EA"/><rect x="90" y="258" width="61" height="44" rx="9" fill="#EAF0FE" stroke="none"/><text x="102" y="289" fill="#3262D9" font-size="23" font-weight="700">01</text><text x="90" y="360" fill="#16283D" font-size="35" font-weight="700">报告生产</text><text x="90" y="405" fill="#586D80" font-size="24" font-weight="400">一份表格，到一份正式报告</text><text x="90" y="486" fill="#3262D9" font-size="42" font-weight="700">约 50 份</text><text x="90" y="528" fill="#586D80" font-size="24" font-weight="400">完整报告正式使用</text><path d="M90 560 L506 560" fill="none" stroke="#D8E2EA" stroke-width="2"/><text x="90" y="606" fill="#16283D" font-size="25" font-weight="400">数据口径 → 图表与解读</text><text x="90" y="647" fill="#16283D" font-size="25" font-weight="400">分级模板 → Word / PDF</text><text x="90" y="688" fill="#16283D" font-size="25" font-weight="400">内容复核 → 逐页验收</text><rect x="566" y="233" width="468" height="494" rx="22" fill="#fff" stroke="#D8E2EA"/><rect x="592" y="258" width="61" height="44" rx="9" fill="#E7F4F0" stroke="none"/><text x="604" y="289" fill="#087F78" font-size="23" font-weight="700">02</text><text x="592" y="360" fill="#16283D" font-size="35" font-weight="700">材料评审</text><text x="592" y="405" fill="#586D80" font-size="24" font-weight="400">AI 提供依据，评委确认结果</text><text x="592" y="486" fill="#087F78" font-size="42" font-weight="700">约 2000 份</text><text x="592" y="528" fill="#586D80" font-size="24" font-weight="400">作品真实评审</text><path d="M592 560 L1008 560" fill="none" stroke="#D8E2EA" stroke-width="2"/><text x="592" y="606" fill="#16283D" font-size="25" font-weight="400">材料与版本 → AI 评分</text><text x="592" y="647" fill="#16283D" font-size="25" font-weight="400">异常复核 → 结果采用</text><text x="592" y="688" fill="#16283D" font-size="25" font-weight="400">最终锁定 → 权威结果</text><rect x="1068" y="233" width="468" height="494" rx="22" fill="#fff" stroke="#D8E2EA"/><rect x="1094" y="258" width="61" height="44" rx="9" fill="#FFF3DF" stroke="none"/><text x="1106" y="289" fill="#AF6B15" font-size="23" font-weight="700">03</text><text x="1094" y="360" fill="#16283D" font-size="35" font-weight="700">团队应用</text><text x="1094" y="405" fill="#586D80" font-size="24" font-weight="400">从一次演示，到真实岗位任务</text><text x="1094" y="486" fill="#AF6B15" font-size="42" font-weight="700">3 场培训</text><text x="1094" y="528" fill="#586D80" font-size="24" font-weight="400">约 100 人参与</text><path d="M1094 560 L1510 560" fill="none" stroke="#D8E2EA" stroke-width="2"/><text x="1094" y="606" fill="#16283D" font-size="25" font-weight="400">岗位任务 → 场景演示</text><text x="1094" y="647" fill="#16283D" font-size="25" font-weight="400">反馈调整 → 实际使用</text><text x="1094" y="688" fill="#16283D" font-size="25" font-weight="400">训后答疑 → 持续支持</text><path d="M64 762 L1536 762" fill="none" stroke="#D8E2EA" stroke-width="2"/><text x="64" y="800" fill="#586D80" font-size="20" font-weight="400">累计使用规模来自项目历次迭代；各案例附成品与范围说明。</text><text x="1110" y="800" fill="#586D80" font-size="20" font-weight="400">需求 · 实现 · 验收 · 用户支持</text></svg>